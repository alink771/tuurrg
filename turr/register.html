<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация – Wanderlux</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="register.css">
</head>
<body>

  <button class="theme-toggle" id="themeBtn" aria-label="Переключить тему">🌓 Тема</button>

  <!-- ШАПКА -->
  <header class="site-header">
    <a href="index.html" class="logo">✈️ Wanderlux</a>
    <nav class="main-nav">
      <a href="index.html#home">Главная</a>
      <a href="index.html#tours">Туры</a>
      <a href="index.html#about">О нас</a>
      <a href="register.html">Регистрация</a>
      <a href="login.html">Вход</a>
    </nav>
    <a href="index.html" class="header-btn btn" style="text-decoration: none;">На главную</a>
    <button class="burger" id="burgerBtn" aria-label="Открыть меню">
      <span></span><span></span><span></span>
    </button>
  </header>

  <div class="overlay" id="overlay"></div>

  <nav class="mobile-nav" id="mobileNav">
    <a href="index.html#home">Главная</a>
    <a href="index.html#tours">Туры</a>
    <a href="register.html">Регистрация</a>
    <a href="login.html">Вход</a>
  </nav>

  <!-- ФОРМА РЕГИСТРАЦИИ -->
  <main class="register-main">
    <form class="register-form" id="registerForm" novalidate>
      <h1>Регистрация</h1>

      <!-- ЗАДАНИЕ 1: Автофокус (autofocus) -->
      <div class="form-group">
        <label for="username">Имя пользователя</label>
        <input type="text" id="username" placeholder="ivan_petrov" autocomplete="username" autofocus>
        <small class="error" id="usernameError"></small>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="ivan@example.com" autocomplete="email">
        <small class="error" id="emailError"></small>
      </div>

      <!-- ЗАДАНИЕ 3: Индикатор силы пароля -->
      <div class="form-group">
        <label for="password">Пароль</label>
        <div class="password-wrapper">
          <input type="password" id="password" placeholder="Минимум 8 символов" autocomplete="new-password">
          <button type="button" class="toggle-password" id="togglePasswordBtn">👁</button>
        </div>
        <div class="strength-bar">
          <div class="strength-fill" id="strengthFill"></div>
        </div>
        <p class="strength-text" id="strengthText">Введите пароль</p>
        <small class="error" id="passwordError"></small>
      </div>

      <div class="form-group">
        <label for="confirm">Подтверждение пароля</label>
        <div class="password-wrapper">
          <input type="password" id="confirm" placeholder="Повторите пароль" autocomplete="new-password">
          <button type="button" class="toggle-password" id="toggleConfirmBtn">👁</button>
        </div>
        <small class="error" id="confirmError"></small>
      </div>

      <!-- ЗАДАНИЕ 2: Чекбокс согласия -->
      <div class="form-group checkbox-group">
        <label class="checkbox-label">
          <input type="checkbox" id="terms">
          <span>Я согласен с <a href="#">условиями обработки</a></span>
        </label>
        <small class="error" id="termsError"></small>
      </div>

      <!-- ЗАДАНИЕ 7: Кнопка со спиннером -->
      <button type="submit" class="submit-btn" id="submitBtn" disabled>
        <span class="btn-text">Зарегистрироваться</span>
        <span class="btn-spinner"></span>
      </button>

      <p class="form-footer">
        Уже есть аккаунт? <a href="login.html">Войти</a>
      </p>
    </form>
  </main>

  <!-- ЗАДАНИЕ 6: Модальное окно успеха -->
  <div class="modal-overlay" id="successModal">
    <div class="modal">
      <div class="modal-icon">✅</div>
      <h2>Регистрация успешна!</h2>
      <p>Добро пожаловать на борт Wanderlux.</p>
      <button class="modal-btn" id="modalClose">Продолжить</button>
    </div>
  </div>
  <footer><p>© 2026 Wanderlux. Путешествуй ярко.</p></footer>

  <script src="script.js"></script>
  <script src="register.js"></script>
</body>
</html>
