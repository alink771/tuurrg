<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход – Wanderlux</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="register.css">
</head>
<body>

  <button class="theme-toggle" id="themeBtn" aria-label="Переключить тему">🌓 Тема</button>

  <header class="site-header">
    <a href="index.html" class="logo">✈️ Wanderlux</a>
    <nav class="main-nav">
      <a href="index.html">Главная</a>
      <a href="register.html">Регистрация</a>
    </nav>
  </header>

  <main class="register-main">
    <form class="register-form" id="loginForm" novalidate>
      <h1>Вход</h1>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="ivan@example.com" autocomplete="email" autofocus>
        <small class="error" id="emailError"></small>
      </div>

      <div class="form-group">
        <label for="password">Пароль</label>
        <div class="password-wrapper">
          <input type="password" id="password" placeholder="Ваш пароль" autocomplete="current-password">
          <button type="button" class="toggle-password" id="togglePasswordBtn">👁</button>
        </div>
        <small class="error" id="passwordError"></small>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn" disabled>
        <span class="btn-text">Войти</span>
        <span class="btn-spinner"></span>
      </button>

      <p class="form-footer">
        Нет аккаунта? <a href="register.html">Зарегистрироваться</a>
      </p>
    </form>
  </main>

  <div class="modal-overlay" id="successModal">
    <div class="modal">
      <div class="modal-icon">🔓</div>
      <h2>Успешный вход!</h2>
      <p>С возвращением в Wanderlux.</p>
      <button class="modal-btn" id="modalClose">Продолжить</button>
    </div>
  </div>

  <footer><p>© 2026 Wanderlux. Путешествуй ярко.</p></footer>

  <script src="script.js"></script>
  <script src="login.js"></script>
</body>
</html>
